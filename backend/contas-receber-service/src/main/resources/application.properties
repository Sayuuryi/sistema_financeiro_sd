spring.application.name=contas-receber-service

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:18084}
spring.profiles.default=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5444/fluxo_receber}
spring.datasource.username=${DB_USER:receber}
spring.datasource.password=${DB_PASSWORD:receber_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=true

server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

integracao.timeout-ms=${HTTP_TIMEOUT_MS:2000}
servicos.cadastros.url=${CADASTROS_URL:http://127.0.0.1:18081}
servicos.contas.url=${CONTAS_URL:http://127.0.0.1:18082}
servicos.planejamento.url=${PLANEJAMENTO_URL:http://127.0.0.1:18083}

frontend.origens=${FRONTEND_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

contas.tipo=RECEBER

seguranca.token-segredo=${TOKEN_SEGREDO:fluxo-segredo-local-de-desenvolvimento-troque}
servicos.usuarios.url=${USUARIOS_URL:http://127.0.0.1:18087}
