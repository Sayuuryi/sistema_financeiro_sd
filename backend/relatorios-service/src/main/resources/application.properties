spring.application.name=relatorios-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:18085}

# Configuração central e registro no servidor de nomes
spring.config.import=optional:configserver:${CONFIG_URL:http://127.0.0.1:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka}

server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
frontend.origens=${FRONTEND_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
servicos.pagar.url=${PAGAR_URL:}
servicos.receber.url=${RECEBER_URL:}
servicos.cadastros.url=${CADASTROS_URL:}
servicos.planejamento.url=${PLANEJAMENTO_URL:}

seguranca.token-segredo=${TOKEN_SEGREDO:fluxo-segredo-local-de-desenvolvimento-troque}
servicos.usuarios.url=${USUARIOS_URL:}

# Leituras nos outros serviços: 2 tentativas no máximo (o frontend desiste em 6,5 s); 4xx não conta
resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.retry.instances.leitura.max-attempts=2
resilience4j.retry.instances.leitura.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
