# Vale para todos os serviços que buscam configuração aqui

eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:local}:${server.port}
spring.cloud.loadbalancer.cache.ttl=5s

management.endpoints.web.exposure.include=health,info,metrics,refresh,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,ratelimiterevents,bulkheads,bulkheadevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# Circuit breaker: abre com metade das últimas 10 chamadas falhando e testa de novo após 15 s
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
# Circuito aberto aparece no health, mas não marca o serviço como fora do ar
resilience4j.circuitbreaker.configs.default.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.configs.default.event-consumer-buffer-size=100

# Retry: até 3 tentativas com espera de 200 ms, 400 ms
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=200ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.event-consumer-buffer-size=100
