resilience4j.bulkhead.instances.exportacao.max-wait-duration=0ms
resilience4j.bulkhead.instances.exportacao.event-consumer-buffer-size=100

# Lidos de novo a cada POST /actuator/refresh
integracao.conexao-ms=1500
integracao.leitura-ms=2000
