# Login e cadastro: 10 tentativas a cada 10 s; sem permissão, responde 429 na hora
resilience4j.ratelimiter.instances.acesso.limit-for-period=10
resilience4j.ratelimiter.instances.acesso.limit-refresh-period=10s
resilience4j.ratelimiter.instances.acesso.timeout-duration=0s
resilience4j.ratelimiter.instances.acesso.register-health-indicator=true
resilience4j.ratelimiter.instances.acesso.allow-health-indicator-to-fail=false
resilience4j.ratelimiter.instances.acesso.event-consumer-buffer-size=100
