spring.application.name=cadastros-service

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:18081}

# Configuração central e registro no servidor de nomes
spring.config.import=optional:configserver:${CONFIG_URL:http://127.0.0.1:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka}

spring.profiles.default=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5441/fluxo_cadastros}
spring.datasource.username=${DB_USER:cadastros}
spring.datasource.password=${DB_PASSWORD:cadastros_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=true

server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

frontend.origens=${FRONTEND_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

seguranca.token-segredo=${TOKEN_SEGREDO:fluxo-segredo-local-de-desenvolvimento-troque}
servicos.usuarios.url=${USUARIOS_URL:}
