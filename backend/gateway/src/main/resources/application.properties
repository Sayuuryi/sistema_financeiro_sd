spring.application.name=gateway
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:18080}

spring.config.import=optional:configserver:${CONFIG_URL:http://127.0.0.1:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka}

frontend.origens=${FRONTEND_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Exportações e envio de imagens passam do 1 s padrão do circuit breaker
resilience4j.timelimiter.configs.default.timeout-duration=20s
