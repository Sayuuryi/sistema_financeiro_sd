spring.application.name=contas-pagar-service

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:18082}

# Configuração central e registro no servidor de nomes
spring.config.import=optional:configserver:${CONFIG_URL:http://127.0.0.1:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka}

spring.profiles.default=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5442/fluxo_contas}
spring.datasource.username=${DB_USER:contas}
spring.datasource.password=${DB_PASSWORD:contas_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=true

server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

frontend.origens=${FRONTEND_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

contas.tipo=PAGAR

seguranca.token-segredo=${TOKEN_SEGREDO:fluxo-segredo-local-de-desenvolvimento-troque}
# Vazias no Docker: o endereço vem do servidor de nomes
servicos.usuarios.url=${USUARIOS_URL:}
servicos.cadastros.url=${CADASTROS_URL:}

# Leituras em cadastros: só falha de rede ou 5xx conta para o circuito e gera nova tentativa
resilience4j.circuitbreaker.instances.cadastros.record-exceptions=br.edu.fluxo.pagar.exceptions.ServicoIndisponivelException
resilience4j.retry.instances.cadastros.retry-exceptions=br.edu.fluxo.pagar.exceptions.ServicoIndisponivelException
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=${HTTP_TIMEOUT_MS:2000}
